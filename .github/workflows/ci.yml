name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (initial JS <= 250 KB gzip)
        run: |
          size=$(gzip -c dist/assets/index-*.js | wc -c)
          echo "initial bundle gzip: $size bytes"
          test "$size" -le 256000
